name: Build KRISH Math Board Single File

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Complete Android Project Automatically
        run: |
          mkdir -p app/src/main/java/com/krish/mathboard

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KRISHMathBoard"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.krish.mathboard'
              compileSdk 34

              defaultConfig {
                  applicationId "com.krish.mathboard"
                  minSdk 21
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="KRISH Math Board"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name="com.krish.mathboard.MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>

          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/krish/mathboard/MainActivity.java
          package com.krish.mathboard;

          import android.app.Activity;
          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.HorizontalScrollView;
          import android.widget.LinearLayout;
          import android.widget.RelativeLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {

              private DrawingBoardView boardView;
              private LinearLayout mathTextContainer;
              private EditText mathInputBox;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  RelativeLayout rootLayout = new RelativeLayout(this);
                  rootLayout.setLayoutParams(new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT));

                  boardView = new DrawingBoardView(this);
                  RelativeLayout.LayoutParams boardParams = new RelativeLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT);
                  boardView.setLayoutParams(boardParams);
                  rootLayout.addView(boardView);

                  HorizontalScrollView topScroll = new HorizontalScrollView(this);
                  topScroll.setId(1001);
                  topScroll.setBackgroundColor(Color.parseColor("#CC1E293B"));
                  RelativeLayout.LayoutParams topParams = new RelativeLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT);
                  topParams.addRule(RelativeLayout.ALIGN_PARENT_TOP);
                  topScroll.setLayoutParams(topParams);

                  LinearLayout toolbar = new LinearLayout(this);
                  toolbar.setOrientation(LinearLayout.HORIZONTAL);
                  toolbar.setPadding(16, 12, 16, 12);
                  toolbar.setGravity(Gravity.CENTER_VERTICAL);

                  TextView title = new TextView(this);
                  title.setText("KRISH Math Board  ");
                  title.setTextColor(Color.parseColor("#FFD700"));
                  title.setTextSize(18);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  toolbar.addView(title);

                  toolbar.addView(createToolButton("White Pen", "#FFFFFF", "#000000", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) { boardView.setPenColor(Color.WHITE, 8f); }
                  }));

                  toolbar.addView(createToolButton("Yellow Pen", "#FFEB3B", "#000000", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) { boardView.setPenColor(Color.YELLOW, 8f); }
                  }));

                  toolbar.addView(createToolButton("Cyan Pen", "#00E5FF", "#000000", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) { boardView.setPenColor(Color.CYAN, 8f); }
                  }));

                  toolbar.addView(createToolButton("Red Pen", "#FF5252", "#FFFFFF", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) { boardView.setPenColor(Color.parseColor("#FF5252"), 8f); }
                  }));

                  toolbar.addView(createToolButton("Eraser", "#E0E0E0", "#000000", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) { boardView.enableEraser(); }
                  }));

                  toolbar.addView(createToolButton("Undo", "#607D8B", "#FFFFFF", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) { boardView.undo(); }
                  }));

                  toolbar.addView(createToolButton("Green Board", "#1B4D3E", "#FFFFFF", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) { boardView.changeBoardColor(Color.parseColor("#1B4D3E")); }
                  }));

                  toolbar.addView(createToolButton("Black Board", "#121212", "#FFFFFF", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) { boardView.changeBoardColor(Color.parseColor("#121212")); }
                  }));

                  toolbar.addView(createToolButton("White Board", "#F5F5F5", "#000000", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          boardView.changeBoardColor(Color.parseColor("#F5F5F5"));
                          boardView.setPenColor(Color.BLACK, 8f);
                      }
                  }));

                  toolbar.addView(createToolButton("Clear All", "#D32F2F", "#FFFFFF", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          boardView.clearBoard();
                          mathTextContainer.removeAllViews();
                      }
                  }));

                  topScroll.addView(toolbar);
                  rootLayout.addView(topScroll);

                  mathTextContainer = new LinearLayout(this);
                  mathTextContainer.setOrientation(LinearLayout.VERTICAL);
                  mathTextContainer.setPadding(32, 24, 32, 24);
                  RelativeLayout.LayoutParams mathContainerParams = new RelativeLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT);
                  mathContainerParams.addRule(RelativeLayout.BELOW, 1001);
                  mathContainerParams.addRule(RelativeLayout.ALIGN_PARENT_LEFT);
                  mathTextContainer.setLayoutParams(mathContainerParams);
                  rootLayout.addView(mathTextContainer);

                  LinearLayout bottomBar = new LinearLayout(this);
                  bottomBar.setOrientation(LinearLayout.HORIZONTAL);
                  bottomBar.setBackgroundColor(Color.parseColor("#DD1E293B"));
                  bottomBar.setPadding(16, 8, 16, 8);
                  bottomBar.setGravity(Gravity.CENTER_VERTICAL);
                  RelativeLayout.LayoutParams bottomParams = new RelativeLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT);
                  bottomParams.addRule(RelativeLayout.ALIGN_PARENT_BOTTOM);
                  bottomBar.setLayoutParams(bottomParams);

                  mathInputBox = new EditText(this);
                  mathInputBox.setHint("Equation (e.g. ax² + bx + c = 0)...");
                  mathInputBox.setHintTextColor(Color.LTGRAY);
                  mathInputBox.setTextColor(Color.WHITE);
                  mathInputBox.setTextSize(16);
                  mathInputBox.setInputType(InputType.TYPE_CLASS_TEXT);
                  LinearLayout.LayoutParams inputParams = new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.WRAP_CONTENT, 1.0f);
                  mathInputBox.setLayoutParams(inputParams);
                  bottomBar.addView(mathInputBox);

                  final String[] symbols = {"²", "³", "√", "π", "θ", "÷", "×", "±", "≠", "≤", "≥"};
                  HorizontalScrollView symbolScroll = new HorizontalScrollView(this);
                  LinearLayout symbolLayout = new LinearLayout(this);
                  symbolLayout.setOrientation(LinearLayout.HORIZONTAL);

                  for (final String sym : symbols) {
                      Button symBtn = createToolButton(sym, "#37474F", "#FFFFFF", new View.OnClickListener() {
                          @Override
                          public void onClick(View v) {
                              mathInputBox.append(sym);
                          }
                      });
                      symbolLayout.addView(symBtn);
                  }
                  symbolScroll.addView(symbolLayout);
                  bottomBar.addView(symbolScroll);

                  Button addMathBtn = createToolButton("Print on Board", "#2E7D32", "#FFFFFF", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          String text = mathInputBox.getText().toString().trim();
                          if (!text.isEmpty()) {
                              addMathFormulaToBoard(text);
                              mathInputBox.setText("");
                          } else {
                              Toast.makeText(MainActivity.this, "Type formula first!", Toast.LENGTH_SHORT).show();
                          }
                      }
                  });
                  bottomBar.addView(addMathBtn);

                  rootLayout.addView(bottomBar);

                  setContentView(rootLayout);
              }

              private Button createToolButton(String text, String bgHex, String textHex, View.OnClickListener listener) {
                  Button btn = new Button(this);
                  btn.setText(text);
                  btn.setBackgroundColor(Color.parseColor(bgHex));
                  btn.setTextColor(Color.parseColor(textHex));
                  btn.setTextSize(13);
                  btn.setAllCaps(false);
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT);
                  params.setMargins(8, 4, 8, 4);
                  btn.setPadding(24, 12, 24, 12);
                  btn.setLayoutParams(params);
                  btn.setOnClickListener(listener);
                  return btn;
              }

              private void addMathFormulaToBoard(String formula) {
                  TextView formulaView = new TextView(this);
                  formulaView.setText(formula);
                  formulaView.setTextSize(28);
                  formulaView.setTypeface(Typeface.SERIF, Typeface.BOLD_ITALIC);
                  formulaView.setTextColor(Color.parseColor("#FFEB3B"));
                  formulaView.setPadding(16, 8, 16, 8);
                  formulaView.setOnLongClickListener(new View.OnLongClickListener() {
                      @Override
                      public boolean onLongClick(View v) {
                          mathTextContainer.removeView(v);
                          Toast.makeText(MainActivity.this, "Formula removed", Toast.LENGTH_SHORT).show();
                          return true;
                      }
                  });
                  mathTextContainer.addView(formulaView);
              }

              private static class DrawingBoardView extends View {

                  private static class Stroke {
                      Path path;
                      Paint paint;
                      boolean isEraser;

                      Stroke(Path path, Paint paint, boolean isEraser) {
                          this.path = path;
                          this.paint = paint;
                          this.isEraser = isEraser;
                      }
                  }

                  private final List<Stroke> strokes = new ArrayList<>();
                  private Path currentPath;
                  private Paint currentPaint;
                  private int boardColor = Color.parseColor("#1B4D3E");
                  private int currentPenColor = Color.WHITE;
                  private float currentStrokeWidth = 8f;
                  private boolean isEraserMode = false;

                  public DrawingBoardView(Context context) {
                      super(context);
                      setupPaint();
                  }

                  private void setupPaint() {
                      currentPaint = new Paint();
                      currentPaint.setAntiAlias(true);
                      currentPaint.setDither(true);
                      currentPaint.setColor(isEraserMode ? boardColor : currentPenColor);
                      currentPaint.setStyle(Paint.Style.STROKE);
                      currentPaint.setStrokeJoin(Paint.Join.ROUND);
                      currentPaint.setStrokeCap(Paint.Cap.ROUND);
                      currentPaint.setStrokeWidth(isEraserMode ? 50f : currentStrokeWidth);
                  }

                  public void setPenColor(int color, float width) {
                      isEraserMode = false;
                      currentPenColor = color;
                      currentStrokeWidth = width;
                      setupPaint();
                  }

                  public void enableEraser() {
                      isEraserMode = true;
                      setupPaint();
                  }

                  public void changeBoardColor(int newColor) {
                      boardColor = newColor;
                      for (Stroke s : strokes) {
                          if (s.isEraser) {
                              s.paint.setColor(boardColor);
                          }
                      }
                      setupPaint();
                      invalidate();
                  }

                  public void undo() {
                      if (!strokes.isEmpty()) {
                          strokes.remove(strokes.size() - 1);
                          invalidate();
                      }
                  }

                  public void clearBoard() {
                      strokes.clear();
                      invalidate();
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      canvas.drawColor(boardColor);
                      for (Stroke s : strokes) {
                          canvas.drawPath(s.path, s.paint);
                      }
                      if (currentPath != null) {
                          canvas.drawPath(currentPath, currentPaint);
                      }
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent event) {
                      float x = event.getX();
                      float y = event.getY();

                      switch (event.getAction()) {
                          case MotionEvent.ACTION_DOWN:
                              currentPath = new Path();
                              currentPath.moveTo(x, y);
                              invalidate();
                              return true;
                          case MotionEvent.ACTION_MOVE:
                              if (currentPath != null) {
                                  currentPath.lineTo(x, y);
                              }
                              invalidate();
                              return true;
                          case MotionEvent.ACTION_UP:
                              if (currentPath != null) {
                                  currentPath.lineTo(x, y);
                                  Paint savedPaint = new Paint(currentPaint);
                                  strokes.add(new Stroke(currentPath, savedPaint, isEraserMode));
                                  currentPath = null;
                              }
                              invalidate();
                              return true;
                          default:
                              return false;
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KRISH-Math-Board-APK
          path: app/build/outputs/apk/debug/app-debug.apk
